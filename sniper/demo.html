<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="routerTitle">Bespoke Digital Storefront & Booking Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #09090b; font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .viewport-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #faf7f2;
    }
    /* Discrete Studio Theme Switcher (top-right pill, auto-collapses on mobile) */
    .studio-switcher {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(9, 9, 11, 0.86);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 5px 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .studio-switcher.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -20px);
    }
    .sw-label {
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      padding: 0 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .sw-btn {
      background: transparent;
      border: none;
      color: #d4d4d8;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.18s;
      white-space: nowrap;
    }
    .sw-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .sw-btn.active {
      background: #f4f4f5;
      color: #09090b;
    }
    .sw-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #a1a1aa;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 11px;
      cursor: pointer;
      margin-left: 4px;
    }
    .sw-close:hover { color: #fff; background: rgba(255,255,255,0.18); }
    @media (max-width: 768px) {
      .studio-switcher {
        max-width: 94vw;
        overflow-x: auto;
        top: 8px;
      }
      .sw-label { display: none; }
    }
  </style>
</head>
<body>
  <div class="studio-switcher" id="studioSwitcher" title="Thanh chuyển nhanh 6 giao diện ngành hàng (Có thể bấm X để ẩn khi khách xem)">
    <span class="sw-label">6 Giao Diện Luxury:</span>
    <button class="sw-btn" data-cat="bakery">Patisserie & Cake</button>
    <button class="sw-btn" data-cat="spa">Luxury Spa</button>
    <button class="sw-btn" data-cat="restaurant">Bistro & Hotpot</button>
    <button class="sw-btn" data-cat="dental">Swiss Dental</button>
    <button class="sw-btn" data-cat="flower">Floral Atelier</button>
    <button class="sw-btn" data-cat="salon">Korean Salon</button>
    <button class="sw-close" id="btnHideSwitcher" title="Ẩn thanh chọn giao diện">✕</button>
  </div>

  <iframe id="templateFrame" class="viewport-frame" title="Bespoke Client Website"></iframe>

  <script>
    (function() {
      const MAP = {
        bakery: "templates/bakery.html",
        spa: "templates/spa.html",
        restaurant: "templates/restaurant.html",
        food: "templates/restaurant.html",
        dental: "templates/dental.html",
        flower: "templates/flower.html",
        salon: "templates/salon.html"
      };

      const params = new URLSearchParams(window.location.search);
      let currentCat = (params.get("cat") || "bakery").toLowerCase();
      if (!MAP[currentCat]) currentCat = "bakery";

      if (params.get("clean") === "1") {
        document.getElementById("studioSwitcher").classList.add("hidden");
      }

      const shopName = params.get("name");
      if (shopName) {
        document.getElementById("routerTitle").textContent = shopName + " — Official Digital Storefront";
      }

      function loadCat(catKey) {
        const targetFile = MAP[catKey] || MAP.bakery;
        const forwardParams = new URLSearchParams(window.location.search);
        forwardParams.set("cat", catKey);
        document.getElementById("templateFrame").src = targetFile + "?" + forwardParams.toString();

        document.querySelectorAll(".sw-btn").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.cat === (catKey === "food" ? "restaurant" : catKey));
        });
      }

      document.querySelectorAll(".sw-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const newCat = btn.dataset.cat;
          params.set("cat", newCat);
          window.history.replaceState({}, "", window.location.pathname + "?" + params.toString());
          loadCat(newCat);
        });
      });

      document.getElementById("btnHideSwitcher").addEventListener("click", () => {
        document.getElementById("studioSwitcher").classList.add("hidden");
      });

      loadCat(currentCat);
    })();
  </script>
</body>
</html>
